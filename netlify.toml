# The live site moved to GitHub Pages on 25 Nov 2026 (Netlify's free credits ran out).
# "ignore = exit 0" tells Netlify to skip every build, so pushes don't spend credits.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "20"

# Every page is the same app; routes live after the # in the address.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
